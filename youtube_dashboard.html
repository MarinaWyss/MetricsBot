<style>
  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #252525;
    --border: #333; --text: #f1f1f1; --text2: #aaa;
    --red: #ff4444; --green: #00c853; --blue: #448aff;
    --yellow: #ffab00; --purple: #aa66cc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; }
  h1 { font-size: 24px; margin-bottom: 4px; }
  .subtitle { color: var(--text2); font-size: 13px; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: 340px 1fr; gap: 20px; height: calc(100vh - 100px); }
  .sidebar { overflow-y: auto; border-right: 1px solid var(--border); padding-right: 16px; }
  .main { overflow-y: auto; padding-left: 4px; }

  /* Sidebar video cards */
  .video-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.2s;
  }
  .video-card:hover { border-color: var(--blue); }
  .video-card.active { border-color: var(--blue); background: var(--surface2); }
  .video-card .title { font-size: 14px; font-weight: 600; margin-bottom: 6px; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .video-card .meta { font-size: 12px; color: var(--text2); display: flex; gap: 12px; margin-bottom: 6px; }
  .video-card .momentum { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; display: inline-block; }
  .momentum.hot { background: rgba(255,68,68,0.2); color: var(--red); }
  .momentum.warm { background: rgba(255,171,0,0.2); color: var(--yellow); }
  .momentum.steady { background: rgba(170,170,170,0.15); color: var(--text2); }
  .momentum.rising { background: rgba(0,200,83,0.2); color: var(--green); }
  .spike-badge { font-size: 11px; background: rgba(255,68,68,0.15); color: var(--red); padding: 1px 6px; border-radius: 3px; margin-left: 6px; }

  /* Sort controls */
  .sort-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .sort-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text2);
    padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }
  .sort-btn.active { border-color: var(--blue); color: var(--blue); }

  /* Main panels */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  .panel h2 { font-size: 18px; margin-bottom: 12px; }
  .panel h3 { font-size: 15px; color: var(--text2); margin-bottom: 8px; margin-top: 16px; }
  .chart-container { position: relative; height: 280px; }
  .analysis { font-size: 13px; line-height: 1.7; white-space: pre-wrap; color: var(--text); }
  .analysis strong { color: var(--blue); }
  .stats-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat-box { background: var(--surface2); border-radius: 6px; padding: 12px 16px; min-width: 120px; }
  .stat-box .label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-box .value { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .no-data { color: var(--text2); font-style: italic; padding: 40px; text-align: center; }

  .search-box { width: 100%; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 13px; margin-bottom: 12px; outline: none; }
  .search-box:focus { border-color: var(--blue); }
  .search-box::placeholder { color: #555; }
</style>

n** - Long-term organization systems for extensive courses\n• **Spaced repetition specifics** - Detailed scheduling and tracking methods\n• **Tech recommendations** - Laptops for AI engineers\n\n*Overall: Highly engaged audience seeking practical learning optimization content.*", "retention_analysis": "## Retention Analysis\n\n**Major Drops Explained:**\n- **DROP 12.1% at 0:10**: Right after the hook, creator says \"Well, turns out it wasn't me\" - classic momentum killer where the initial problem setup deflates\n- **DROP 11.0% at 0:21**: Starts credentials dump (\"I'm a senior applied scientist at Amazon...\") - viewers came for study tips, not a resume\n- **DROP 5.4% at 0:26**: Continues with mentoring stats and generalizations about \"hundreds of times\" - feels like filler content\n\n**Spike Explained:**\n- **SPIKE 7.0% at 5:33**: Likely hitting a concrete, actionable technique or revealing a surprising research finding that re-engages viewers seeking practical value\n\n## Top 3 Viewer-Losing Moments\n1. **Credentials section (0:16-0:26)** - Authority building kills momentum; viewers want solutions, not backgrounds\n2. **Deflating the hook (0:10)** - Immediately resolving tension instead of building it\n3. **Generic problem description (0:27-0:32)** - Talking about \"hundreds of people\" feels abstract vs. personal\n\n## Top 3 Engaging Moments\n1. **Opening hook (0:00-0:09)** - Relatable pain point most students experience\n2. **Concrete research stats** - \"80% vs 34% retention\" gives credible, specific value\n3. **The spike moment** - Likely a surprising technique or counterintuitive insight\n\n## Actionable Scripting Advice\n1. **Delay credentials until after delivering value** - Lead with techniques, establish authority through results, not titles\n2. **Extend tension longer** - Don't resolve the hook immediately; keep the \"why\" mysterious for 30-60 more seconds\n3. **Front-load the most surprising insight** - Move your most counterintuitive finding (like t evolution** - New focus on project explanations vs. algorithm memorization  \n• **Industry chaos/uncertainty** - Rapid changes making it hard for both candidates and companies to adapt\n• **Practical coding skills** - Emphasis on real-world projects and architectural thinking over theoretical knowledge\n• **Tool mentions** - Jobbyo platform and coding tools getting positive mentions\n\n### Overall Sentiment:\n• **Mixed (60% positive, 25% frustrated, 15% neutral)**\n• Positive: Appreciate practical advice, authenticity about AI\n• Negative: Frustrated with industry changes, inconsistent interview processes\n• Many find content helpful despite career uncertainty\n\n### Notable Feedback:\n• **Praise:** \"Love how you're being real about AI instead of fear-mongering\"\n• **Constructive:** Request for balanced interviews (some leetcode + practical skills)\n• **Criticism:** Some technical audio issues mentioned\n\n### Content Requests:\n• Tips for career changers (Data Science/ML)\n• 1-on-1 guidance calls availability\n• System design and project management content\n• Certification guidance\n• Follow-up interview preparation videos\n\n**Key insight:** Viewers appreciate honest, practical advice about navigating AI-era interviews but want more specific guidance for their situations.", "retention_analysis": "## Retention Drop Analysis\n\n**DROP 16.6% at 0:14:** Right after the sponsor mention, viewers hit the typical \"sponsor skip\" behavior, leaving during the transition from HubSpot thanks to the main content setup.\n\n**DROP 10.4% at 0:22:** The phrase \"what I heard should change how a lot of you are preparing\" is vague promise-making without concrete value. Viewers want specifics, not more buildup.\n\n**DROP 6.3% at 0:29:** \"There is no single playbook anymore\" sounds discouraging rather than helpful. Viewers came for solutions, not to hear their situation is more complicated.\n\n**DROP 3.4% at 0:44:** Starting the explanation with \"why everything got so confusing\" delays the promised value. Viewers want the new interview formats, not historical context.\n\n## Key Moments\n\n**Top 3 Viewer-Losing Moments:**\n1. **Sponsor transition (0:14)** - Predictable drop after sponsorship\n2. **Vague promises (0:22)** - \"What I heard should change...\" without specifics\n3. **Discouraging framing (0:29)** - Telling viewers there's \"no playbook\" feels defeating\n\n**Top 3 Viewer-Retaining Moments:**\n1. **Strong hook (0:02-0:09)** - \"grinding leetcode 5 hours a day\" + \"format your company doesn't use\"\n2. **Credible authority (0:11-0:15)** - Conference with 500 engineers/hiring managers\n3. **Concrete statistics (0:59+)** - \"43% of assessments\" and specific percentages\n\n## Actionable Scripting Advice\n\n1. **Front-load one concrete example** - Instead of building up to \"4 interview modes,\" give viewers one shocking specific example in the first 30 seconds (\"Company A gives leetcode hard with no AI, Company B requires you to use Claude...\")\n\n2. **Reframe problems as opportunities** - Replace \"there's no single playbook\" with \"companies now use 4 distinct formats - here's how to identify which one\"\n\n3. **Delay context, accelerate value** - Move the \"why it's confusing\" section after delivering the promised interview modes. Viewers want solutions before explanations."}, {"video_id": "bBKQsC292ow", "title": "Why You're Still Not Ready For AI Engineering (Even After Months of Studying)", "published_at": "2026-03-26", "views": 21480, "likes": 479, "comments_count": 33, "duration_min": 8.38, "daily_views": [{"date": "2026-03-26", "views": 3463, "watch_min": 11563.0}, {"date": "2026-03-27", "views": 1594, "watch_min": 4271.0}, {"date": "2026-03-28", "views": 414, "watch_min": 1312.0}, {"date": "2026-03-29", "views": 405, "watch_min": 1199.0}, {"date": "2026-03-30", "views": 329, "watch_min": 980.0}, {"date": "2026-03-31", "views": 298, "watch_min": 964.0}, {"date": "2026-04-01", "views": 207, "watch_min": 581.0}, {"da function fmt(n) { return n >= 1000000 ? (n/1000000).toFixed(1)+'M' : n >= 1000 ? (n/1000).toFixed(1)+'K' : n.toString(); }

function momentumLabel(score) {
  if (score > 100) return ['HOT — Taking off!', 'hot'];
  if (score > 30) return ['Rising', 'rising'];
  if (score > -10) return ['Steady', 'steady'];
  return ['Cooling', 'warm'];
}

function sortBy(key) {
  currentSort = key;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderVideoList();
}

function filterVideos() {
  renderVideoList();
}

function getSortedVideos() {
  const q = document.getElementById('search').value.toLowerCase();
  let vids = VIDEOS.filter(v => v.title.toLowerCase().includes(q));
  switch(currentSort) {
    case 'momentum': vids.sort((a,b) => b.momentum - a.momentum); break;
    case 'views': vids.sort((a,b) => b.views - a.views); break;
    case 'recent': vids.sort((a,b) => b.published_at.localeCompare(a.published_at)); break;
    case 'spikes': vids.sort((a,b) => (b.spikes?.length||0) - (a.spikes?.length||0)); break;
  }
  return vids;
}

function renderVideoList() {
  const vids = getSortedVideos();
  const container = document.getElementById('video-list');
  container.innerHTML = vids.map(v => {
    const [mLabel, mClass] = momentumLabel(v.momentum);
    const spikeCount = v.spikes?.length || 0;
    return `<div class="video-card ${v.video_id === selectedVideoId ? 'active' : ''}" onclick="selectVideo('${v.video_id}')">
      <div class="title">${v.title}</div>
      <div class="meta">
        <span>${v.published_at}</span>
        <span>${fmt(v.views)} views</span>
        <span>${v.duration_min}m</span>
      </div>
      <span class="momentum ${mClass}">${mLabel} (${v.momentum > 0 ? '+' : ''}${v.momentum}%)</span>
      ${spikeCount > 0 ? `<span class="spike-badge">${spikeCount} spike${spikeCount>1?'s':''}</span>` : ''}
    </div>`;
  }).join('');
}

        <div class="stat-box"><div class="label">Comments</div><div class="value">${fmt(v.comments_count)}</div></div>
        <div class="stat-box"><div class="label">Duration</div><div class="value">${v.duration_min}m</div></div>
        <div class="stat-box"><div class="label">7-Day Momentum</div><div class="value" style="color:var(--${mClass === 'hot' ? 'red' : mClass === 'rising' ? 'green' : 'text2'})">${v.momentum > 0 ? '+' : ''}${v.momentum}%</div></div>
      </div>
      <h3>Daily Views (Last ${VIDEOS[0]?.daily_views?.length || 180} days)</h3>
      <div class="chart-container"><canvas id="trendChart"></canvas></div>
    </div>

    ${v.retention && v.retention.length > 0 ? `
    <div class="panel">
      <h2>Audience Retention Curve</h2>
      <div class="chart-container"><canvas id="retentionChart"></canvas></div>
      ${v.retention_analysis ? `<h3>Retention vs. Script Analysis (Claude)</h3><div class="analysis">${escapeHtml(v.retention_analysis)}</div>` : ''}
    </div>` : ''}

    ${v.comment_analysis ? `
    <div class="panel">
      <h2>Comment Themes (Claude Analysis)</h2>
      <div class="analysis">${escapeHtml(v.comment_analysis)}</div>
    </div>` : ''}
  `;

  renderTrendChart(v);
  if (v.retention && v.retention.length > 0) renderRetentionChart(v);
}

function escapeHtml(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function renderTrendChart(v) {
  if (trendChart) trendChart.destroy();
  const ctx = document.getElementById('trendChart');
  if (!ctx || !v.daily_views?.length) return;

  const labels = v.daily_views.map(d => d.date);
  const views = v.daily_views.map(d => d.views);

  // Mark spike days
  const spikeSet = new Set((v.spikes || []).map(s => s.date));
  const pointColors = labels.map(l => spikeSet.has(l) ? '#ff4444' : 'transparent');
  const pointRadii = labels.map(l => spikeSet.has(l) ? 5 : 0);

  trendChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Daily Views',
        data: views,
        borderColor: '#448aff',
        backgroundColor: 'rgba(68,138,255,0.1)',
        fill: true,
        tension: 0.3,
        pointBackgroundColor: pointColors,
        pointRadius: pointRadii,
        pointHoverRadius: 6,
        borderWidth: 2,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const spike = (v.spikes||[]).find(s => s.date === labels[ctx.dataIndex]);
              if (spike) return `${ctx.parsed.y} views (${spike.multiplier}x avg!)`;
              return `${ctx.parsed.y} views`;
            }
          }
        }
      },
      scales: {
        x: { ticks: { maxTicksLimit: 12, color: '#666' }, grid: { color: '#222' } },
        y: { ticks: { color: '#666' }, grid: { color: '#222' } }
      }
    }
  });
}

function renderRetentionChart(v) {
  if (retentionChart) retentionChart.destroy();
  const ctx = document.getElementById('retentionChart');
  if (!ctx) return;

  const labels = v.retention.map(r => {
    const totalSec = r.position * v.duration_min * 60;
    const m = Math.floor(totalSec / 60);
    const s = Math.floor(totalSec % 60);
    return `${m}:${String(s).padStart(2,'0')}`;
  });

  retentionChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Retention %',
          data: v.retention.map(r => r.retention),
          borderColor: '#00c853',
          backgroundColor: 'rgba(0,200,83,0.1)',
          fill: true, tension: 0.3, borderWidth: 2, pointRadius: 0, pointHoverRadius: 4,
        },
        {
          label: 'Relative (vs avg)',
          data: v.retention.map(r => r.relative * 100),
          borderColor: '#aa66cc',
          borderDash: [4, 4],
          tension: 0.3, borderWidth: 1.5, pointRadius: 0, pointHoverRadius: 4, fill: false,
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        tooltip: {
          callbacks: {
            title: (items) => `Timestamp: ${items[0].label}`,
          }
        }
      },
      scales: {
        x: { ticks: { maxTicksLimit: 15, color: '#666' }, grid: { color: '#222' },
               title: { display: true, text: 'Video Timeline', color: '#666' } },
        y: { ticks: { color: '#666', callback: v => v+'%' }, grid: { color: '#222' },
               title: { display: true, text: 'Viewers Remaining', color: '#666' } }
      }
    }
  });
}

// Auto-select the highest-momentum video on load
renderVideoList();
if (VIDEOS.length > 0) {
  const sorted = [...VIDEOS].sort((a,b) => b.momentum - a.momentum);
  selectVideo(sorted[0].video_id);
}
</script>
